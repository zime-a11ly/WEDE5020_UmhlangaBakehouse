<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bakery responsive review</title><style>
body{margin:0;background:#d7ccc8;color:#3e2723;font:14px Arial,sans-serif}header{padding:16px 25px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:17px;margin:0}label{display:flex;gap:9px;align-items:center}select{padding:9px;border:1px solid #755f55;border-radius:3px;background:#fff8f0}main{padding:10px 20px 30px;display:flex;justify-content:center;overflow:auto}iframe{width:390px;height:780px;border:0;background:#fff8f0;flex-shrink:0;box-shadow:0 4px 25px #3e272333}output{font-size:12px}
</style></head><body><header><h1>Responsive review</h1><label>Page <select id="page"><option value="index">Home</option><option value="products">Our bakes</option><option value="about">Our story</option><option value="gallery">Gallery</option><option value="contact">Contact</option><option value="enquiry">Enquiry</option><option value="cart">Bag</option><option value="privacy">Privacy</option></select></label><label>Viewport <select id="width"><option value="390">Phone · 390px</option><option value="320">Small phone · 320px</option><option value="768">Tablet · 768px</option><option value="1024">Laptop · 1024px</option></select></label><output id="status">Loading…</output></header><main><iframe id="preview" title="Responsive website preview" src="../index.html"></iframe></main><script>
const frame=document.getElementById('preview'),page=document.getElementById('page'),width=document.getElementById('width'),status=document.getElementById('status');
function inspect(){const doc=frame.contentDocument;if(!doc)return;const overflow=doc.documentElement.scrollWidth>frame.clientWidth;status.textContent=overflow?'Horizontal overflow detected':'No horizontal overflow at '+width.value+'px';}
page.addEventListener('change',()=>{frame.src='../'+page.value+'.html';status.textContent='Loading…';});
width.addEventListener('change',()=>{frame.style.width=width.value+'px';requestAnimationFrame(inspect);});
frame.addEventListener('load',()=>{frame.contentDocument.fonts.ready.then(inspect);});
</script></body></html>
